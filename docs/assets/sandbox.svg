<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:696px;height:766px;background:#FAFAFA;" width="696px" height="766px" viewBox="0 0 696 766" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="696" height="766" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="4"><text x="141.286" y="81.17" fill="#000" font-size="25" textLength="411.951" font-weight="700">What the sandbox setup creates</text></g><!--cluster Mac--><g class="cluster" data-qualified-name="Mac" id="ent0001" data-source-line="38"><rect x="63.262" y="131.443" width="568" height="479.51" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="304.116" y="162.846" fill="#000" font-size="18" textLength="86.291" font-weight="700">Your Mac</text></g><!--cluster VM--><g class="cluster" data-qualified-name="Mac.VM" id="ent0002" data-source-line="39"><rect x="87.262" y="203.443" width="520" height="383.51" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="251.004" y="234.846" fill="#000" font-size="18" textLength="192.516" font-weight="700">Colima VM: collab-ai</text><text x="279.045" y="256.045" fill="#000" font-size="18" textLength="136.433" font-weight="700">Provides Linux</text></g><!--cluster Project--><g class="cluster" data-qualified-name="Mac.VM.Project" id="ent0003" data-source-line="40"><rect x="111.262" y="296.443" width="472" height="266.51" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="240.299" y="327.846" fill="#000" font-size="18" textLength="213.926" font-weight="700">Incus project: collab-ai</text><text x="205.38" y="349.045" fill="#000" font-size="18" textLength="283.764" font-weight="700">Groups the sandbox resources</text></g><!--entity Workspace--><g class="entity" data-qualified-name="Mac.VM.Project.Workspace" id="ent0004" data-source-line="41"><rect x="127.192" y="381.443" width="440.149" height="165.508" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="149.192" y="424.713" fill="#000" font-size="22" textLength="121.505" font-weight="700">workspace</text><text x="149.192" y="446.756" fill="#000" font-size="18" textLength="200.285">Offline Linux container</text><line x1="128.192" y1="462.553" x2="566.341" y2="462.553" style="stroke:#181818;stroke-width:1;"/><text x="149.192" y="495.955" fill="#000" font-size="18" textLength="317.048">2 CPUs · 4 GiB memory · 10 GiB disk</text><text x="149.192" y="517.154" fill="#000" font-size="18" textLength="396.149">No network · no host mounts · no credentials</text></g><g class="legend" data-source-line="52"><rect x="40" y="638.953" width="614.523" height="85.688" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="64" y="678.422" fill="#000" font-size="16" textLength="54.547" font-weight="700">Today:</text><text x="123.609" y="678.422" fill="#000" font-size="16" textLength="498.469">Codex, Claude Code and the broker run outside this workspace.</text><text x="64" y="697.266" fill="#000" font-size="16" textLength="77.883" font-weight="700">On Linux:</text><text x="146.945" y="697.266" fill="#000" font-size="16" textLength="483.578">Incus runs directly on the host; the Colima VM is unnecessary.</text></g></g></svg>