ncus project: collab-ai</text></g><!--entity Secured--><g class="entity" data-qualified-name="Mac.VM.Project.Secured" id="ent0004" data-source-line="39"><rect x="143.171" y="381.443" width="358.682" height="165.508" fill="#E3EFFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="165.171" y="424.713" fill="#000" font-size="22" textLength="314.682" font-weight="700">secured · control (optional)</text><text x="165.171" y="446.756" fill="#000" font-size="18" textLength="263.593">One broker + SQLite database</text><line x1="144.171" y1="462.553" x2="500.852" y2="462.553" style="stroke:#181818;stroke-width:1;"/><text x="165.171" y="495.955" fill="#000" font-size="18" textLength="199.477">Private persistent state</text><text x="165.171" y="517.154" fill="#000" font-size="18" textLength="182.795">No network interface</text></g><!--entity Workspace--><g class="entity" data-qualified-name="Mac.VM.Project.Workspace" id="ent0005" data-source-line="46"><rect x="143.511" y="674.953" width="372.008" height="250.305" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="165.511" y="718.223" fill="#000" font-size="22" textLength="190.577" font-weight="700">workspace · dev</text><text x="165.511" y="740.266" fill="#000" font-size="18" textLength="285.697">Your repository, builds and tests</text><text x="165.511" y="761.465" fill="#000" font-size="18" textLength="328.008">Commands run as unprivileged agent</text><line x1="144.511" y1="777.262" x2="514.519" y2="777.262" style="stroke:#181818;stroke-width:1;"/><text x="165.511" y="810.664" fill="#000" font-size="18" textLength="223.269">Codex + Claude adapters</text><text x="165.511" y="831.864" fill="#000" font-size="18" textLength="188.262">Read-only dashboard</text><text x="165.511" y="853.063" fill="#000" font-size="18" textLength="248.783">Rootless Docker + Compose</text><text x="165.511" y="874.262" fill="#000" font-size="18" textLength="265.289">Selected host mounts optional</text><text x="165.511" y="895.461" fill="#000" font-size="18" textLength="303.196">Network access enabled by default</text></g><!--entity Data--><g class="entity" data-qualified-name="Mac.VM.Project.Data" id="ent0006" data-source-line="57"><path d="M172.841,986.253 L213.841,986.253 A3.75,3.75 0 0 1 216.341,988.753 L223.341,1007.253 L486.172,1007.253 A2.5,2.5 0 0 1 488.672,1009.753 L488.672,1130.55 A2.5,2.5 0 0 1 486.172,1133.05 L172.841,1133.05 A2.5,2.5 0 0 1 170.341,1130.55 L170.341,988.753 A2.5,2.5 0 0 1 172.841,986.253" style="stroke:#181818;stroke-width:0.5;" fill="#E7F5EB"/><line x1="170.341" y1="1007.253" x2="223.341" y2="1007.253" style="stroke:#181818;stroke-width:0.5;"/><text x="192.341" y="1043.656" fill="#000" font-size="18" textLength="200.382">Persistent dev volumes</text><text x="192.341" y="1064.855" fill="#000" font-size="18" textLength="236.065">/workspace · /home/agent</text><text x="192.341" y="1086.054" fill="#000" font-size="18" textLength="224.121">/var/lib/collab-ai-docker</text><text x="192.341" y="1107.253" fill="#000" font-size="18" textLength="264.331">Retained when dev is replaced</text></g><!--link Workspace to Data--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk7" data-source-line="58" data-link-type="dependency"><path d="M329.511,925.733 C329.511,946.403 329.511,983.213 329.511,1002.043" style="stroke:#181818;stroke-width:1;" fill="none" id="Workspace-to-Data"/><polygon points="329.511,1007.043,333.511,998.043,329.511,1002.043,325.511,998.043,329.511,1007.043" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Secured to Workspace--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk8" data-source-line="61" data-link-type="dependency"><path d="M290.651,547.393 C287.861,557.233 285.481,567.233 283.851,576.953 C278.521,608.693 280.284,637.916 286.474,669.656" style="stroke:#181818;stroke-width:1;" fill="none" id="Secured-to-Workspace"/><