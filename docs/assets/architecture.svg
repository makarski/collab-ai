<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1127px;height:1536px;background:#FAFAFA;" width="1127px" height="1536px" viewBox="0 0 1127 1536" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="byc5qf6hpxk0o0" x="0" y="0" width="1" height="1"><feFlood flood-color="#E7F5EB" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="byc5qf6hpxk0o1" x="0" y="0" width="1" height="1"><feFlood flood-color="#E3EFFF" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="byc5qf6hpxk0o2" x="0" y="0" width="1" height="1"><feFlood flood-color="#FCE4F0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="byc5qf6hpxk0o3" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1127" height="1536" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="4"><text x="269.46" y="87.17" fill="#000" font-size="25" textLength="586.499" font-weight="700">collab-ai · Shared broker and dev workspace</text></g><!--cluster Dev--><g class="cluster" data-qualified-name="Dev" id="ent0002" data-source-line="53"><rect x="31" y="310.783" width="532" height="958.25" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="186.316" y="338.252" fill="#000" font-size="16" textLength="221.367" font-weight="700">workspace · dev container</text></g><!--cluster Control--><g class="cluster" data-qualified-name="Control" id="ent0008" data-source-line="61"><rect x="646" y="310.783" width="428" height="678.87" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="746.676" y="338.252" fill="#000" font-size="16" textLength="226.648" font-weight="700">secured · control container</text></g><!--entity Codex--><g class="entity" data-qualified-name="Dev.Codex" id="ent0003" data-source-line="54"><rect x="46.88" y="367.783" width="236.234" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="66.88" y="407.119" fill="#000" font-size="20" textLength="63.809" font-weight="700">Codex</text><text x="66.88" y="426.807" fill="#000" font-size="16" textLength="193.633">Terminal + collab-codex</text><text x="66.88" y="445.651" fill="#000" font-size="16" textLength="196.234">Managed proxy / listener</text></g><!--entity Claude--><g class="entity" data-qualified-name="Dev.Claude" id="ent0004" data-source-line="55"><rect x="322.69" y="367.783" width="224.625" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="342.69" y="407.119" fill="#000" font-size="20" textLength="129.199" font-weight="700">Claude Code</text><text x="342.69" y="426.807" fill="#000" font-size="16" textLength="180.016">Terminal + collab-mcp</text><text x="342.69" y="445.651" fill="#000" font-size="16" textLength="184.625">MCP over stdin / stdout</text></g><!--entity Project--><g class="entity" data-qualified-name="Dev.Project" id="ent0005" data-source-line="56"><rect x="47.49" y="825.643" width="463.016" height="185.773" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="67.49" y="864.979" fill="#000" font-size="20" textLength="319.199" font-weight="700">Workspace storage · proposed</text><text x="67.49" y="884.667" fill="#000" font-size="16" textLength="338.313">Default: persistent Incus workspace volume</text><text x="67.49" y="903.511" fill="#000" font-size="16" textLength="253.32">Optional: selected host directory</text><text x="67.49" y="922.354" fill="#000" font-size="16" textLength="369.641">Host mount: read-only unless opted into writes</text><line x1="48.49" y1="935.729" x2="509.506" y2="935.729" style="stroke:#181818;stroke-width:1;"/><text x="67.49" y="965.198" fill="#000" font-size="16" textLength="423.016">Dedicated sandbox UID/GID; no personal host identity</text><text x="67.49" y="984.042" fill="#000" font-size="16" textLength="378.711">Run shell commands, builds and tests inside dev</text></g><!--entity AgentHome--><g class="entity" data-qualified-name="Dev.AgentHome" id="ent0006" data-source-line="57"><path d="M48.52,1050.913 L48.52,1250.531 A2.5,2.5 0 0 0 51.02,1253.031 L506.989,1253.031 A2.5,2.5 0 0 0 509.489,1250.531 L509.489,1058.413 L499.489,1048.413 L51.02,1048.413 A2.5,2.5 0 0 0 48.52,1050.913" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><path d="M499.489,1048.413 L499.489,1055.913 A2.5,2.5 0 0 0 501.989,1058.413 L509.489,1058.413" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><text x="68.52" y="1087.749" fill="#000" font-size="20" textLength="354.756" font-weight="700">Persistent agent home · proposed</text><text x="68.52" y="1107.437" fill="#000" font-size="16" textLength="321.531">/home/agent on a separate Incus volume</text><text x="68.52" y="1126.281" fill="#000" font-size="16" textLength="242.133">Survives container replacement</text><text x="68.52" y="1145.124" fill="#000" font-size="16" textLength="420.969">Codex + Claude settings, skills, memory and sessions</text><line x1="49.52" y1="1158.499" x2="508.489" y2="1158.499" style="stroke:#181818;stroke-width:1;"/><text x="68.52" y="1187.968" fill="#000" font-size="16" textLength="337.242">Import selected host config / memory once</text><text x="68.52" y="1206.812" fill="#000" font-size="16" textLength="287.898">Agents update sandbox-owned state</text><text x="68.52" y="1225.656" fill="#000" font-size="16" textLength="380.719">Explicit backup / export; no live host-home sync</text></g><!--entity Socket--><g class="entity" data-qualified-name="Dev.Socket" id="ent0007" data-source-line="58"><path d="M76.85,547.523 L76.85,747.141 A2.5,2.5 0 0 0 79.35,749.641 L418.655,749.641 A2.5,2.5 0 0 0 421.155,747.141 L421.155,555.023 L411.155,545.023 L79.35,545.023 A2.5,2.5 0 0 0 76.85,547.523" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><path d="M411.155,545.023 L411.155,552.523 A2.5,2.5 0 0 0 413.655,555.023 L421.155,555.023" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><text x="96.85" y="584.359" fill="#000" font-size="20" textLength="266.846" font-weight="700">broker.sock · Unix socket</text><text x="96.85" y="604.047" fill="#000" font-size="16" textLength="226.203">/mnt/collab-ipc/broker.sock</text><text x="96.85" y="622.891" fill="#000" font-size="16" textLength="296.469">Directory mounted READ-ONLY in dev</text><text x="96.85" y="641.734" fill="#000" font-size="16" textLength="289.063">Owner: broker · group: collab-clients</text><text x="96.85" y="660.578" fill="#000" font-size="16" textLength="150.297">Socket mode: 0660</text><line x1="77.85" y1="673.953" x2="420.155" y2="673.953" style="stroke:#181818;stroke-width:1;"/><text x="96.85" y="703.422" fill="#000" font-size="16" textLength="304.305">Clients may connect and send requests</text><text x="96.85" y="722.266" fill="#000" font-size="16" textLength="286.047">Cannot replace or remove the socket</text></g><!--entity Dashboard--><g class="entity" data-qualified-name="Control.Dashboard" id="ent0009" data-source-line="62"><rect x="662.47" y="367.783" width="287.063" height="101.242" fill="#FFF3B0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="682.47" y="407.119" fill="#000" font-size="20" textLength="163.955" font-weight="700">Human controls</text><text x="682.47" y="426.807" fill="#000" font-size="16" textLength="247.063">collab dashboard · collab status</text><text x="682.47" y="445.651" fill="#000" font-size="16" textLength="211.711">Operator settings stay here</text></g><!--entity Broker--><g class="entity" data-qualified-name="Control.Broker" id="ent0010" data-source-line="63"><rect x="715.47" y="596.713" width="289.063" height="101.242" fill="#E3EFFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="735.47" y="636.049" fill="#000" font-size="20" textLength="215.557" font-weight="700">One collab-ai broker</text><text x="735.47" y="655.737" fill="#000" font-size="16" textLength="249.063">Creates / listens on broker.sock</text><text x="735.47" y="674.581" fill="#000" font-size="16" textLength="234.484">Only process accessing SQLite</text></g><!--entity DB--><g class="entity" data-qualified-name="Control.DB" id="ent0011" data-source-line="64"><path d="M662.28,873.413 C662.28,863.413 860,863.413 860,863.413 C860,863.413 1057.719,863.413 1057.719,873.413 L1057.719,963.656 C1057.719,973.656 860,973.656 860,973.656 C860,973.656 662.28,973.656 662.28,963.656 L662.28,873.413" style="stroke:#181818;stroke-width:0.5;" fill="#E3EFFF"/><path d="M662.28,873.413 C662.28,883.413 860,883.413 860,883.413 C860,883.413 1057.719,883.413 1057.719,873.413" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="682.28" y="916.749" fill="#000" font-size="20" textLength="355.439" font-weight="700">One collaboration SQLite database</text><text x="682.28" y="936.437" fill="#000" font-size="16" textLength="195.953">Private persistent volume</text><text x="682.28" y="955.281" fill="#000" font-size="16" textLength="171.078">Never mounted in dev</text></g><!--entity Human--><g class="entity" data-qualified-name="Human" id="ent0001" data-source-line="51"><ellipse cx="435.005" cy="146.443" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M435.005,154.443 L435.005,181.443 M422.005,162.443 L448.005,162.443 M435.005,181.443 L422.005,196.443 M435.005,181.443 L448.005,196.443" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="356.79" y="223.412" fill="#000" font-size="16" textLength="156.43">You · host terminals</text></g><!--link Human to Codex--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk12" data-source-line="67" data-link-type="dependency"><path d="M346.53,197.683 C304.42,206.303 256.15,222.903 223,254.783 C192.21,284.393 178.659,326.511 171.869,362.401" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Codex"/><polygon points="170.94,367.313,176.543,359.214,171.869,362.401,168.683,357.727,170.94,367.313" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="234" y="281.252" fill="#000" font-size="16" textLength="180.016">SSH · prompts / output</text></g><!--link Human to Claude--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk13" data-source-line="68" data-link-type="dependency"><path d="M435,237.213 C435,275.583 435,323.793 435,362.443" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Claude"/><polygon points="435,367.443,439,358.443,435,362.443,431,358.443,435,367.443" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="446" y="281.252" fill="#000" font-size="16" textLength="180.016">SSH · prompts / output</text></g><!--link Human to Dashboard--><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" id="lnk14" data-source-line="69" data-link-type="dependency"><path d="M523.46,205.713 C563.18,216.043 609.44,231.743 647,254.783 C695.13,284.303 735.934,327.714 765.384,363.704" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Dashboard"/><polygon points="768.55,367.573,765.946,358.075,765.384,363.704,759.755,363.141,768.55,367.573" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="707.62" y="281.252" fill="#000" font-size="16" textLength="216.055">Host-administered terminal</text></g><!--link Codex to Socket--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk15" data-source-line="71" data-link-type="dependency"><path d="M179.72,469.283 C185.39,487.573 192.15,508.353 199,527.023 C201.13,532.823 201.559,534.093 203.879,540.063" style="stroke:#181818;stroke-width:1;" fill="none" id="Codex-to-Socket"/><polygon points="205.69,544.723,206.158,534.886,203.879,540.063,198.702,537.783,205.69,544.723" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="210" y="513.492" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Claude to Socket--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk16" data-source-line="72" data-link-type="dependency"><path d="M394.06,469.523 C379.24,487.643 362.38,508.263 347,527.023 C342.24,532.833 340.518,534.925 335.588,540.945" style="stroke:#181818;stroke-width:1;" fill="none" id="Claude-to-Socket"/><polygon points="332.42,544.813,341.217,540.385,335.588,540.945,335.028,535.316,332.42,544.813" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="389.48" y="513.492" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Socket to Project--><!--link Project to AgentHome--><!--link Dashboard to Broker--><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" id="lnk19" data-source-line="76" data-link-type="dependency"><path d="M817.92,469.483 C826.89,507.203 837.982,553.829 846.952,591.519" style="stroke:#181818;stroke-width:1;" fill="none" id="Dashboard-to-Broker"/><polygon points="848.11,596.383,849.918,586.702,846.952,591.519,842.135,588.554,848.11,596.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="842.38" y="513.492" fill="#000" font-size="16" textLength="240.039">Queries via the same local UDS</text></g><!--link Socket to Broker--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" id="lnk21" data-source-line="77" data-link-type="dependency"><path d="M426.64,647.333 C519.27,647.333 622.15,647.333 710.16,647.333" style="stroke:#181818;stroke-width:1;" fill="none" id="Socket-Broker"/><polygon points="421.64,647.333,430.64,651.333,426.64,647.333,430.64,643.333,421.64,647.333" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="715.16,647.333,706.16,643.333,710.16,647.333,706.16,651.333,715.16,647.333" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="465.451" y="592.802" fill="#000" font-size="16" textLength="206.281">Same shared Incus volume</text><text x="505.611" y="611.646" fill="#000" font-size="16" textLength="125.961">/mnt/collab-ipc</text><text x="451.81" y="630.49" fill="#000" font-size="16" textLength="233.563">READ-WRITE mount in control</text></g><!--link Broker to DB--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk22" data-source-line="78" data-link-type="dependency"><path d="M860,698.333 C860,745.163 860,809.973 860,858.173" style="stroke:#181818;stroke-width:1;" fill="none" id="Broker-to-DB"/><polygon points="860,863.173,864,854.173,860,858.173,856,854.173,860,863.173" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="871" y="794.112" fill="#000" font-size="16" textLength="94.852">Read / write</text></g><g class="legend" data-source-line="80"><rect x="133.747" y="1301.033" width="857.926" height="185.328" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="160.493" y="1337.535" fill="#000" font-size="15" textLength="99.324" filter="url(#byc5qf6hpxk0o0)">Agents in dev</text><text x="264.563" y="1337.535" fill="#000" font-size="15" textLength="14.238">   </text><text x="283.547" y="1337.535" fill="#000" font-size="15" textLength="133" filter="url(#byc5qf6hpxk0o1)">Services in control</text><text x="421.294" y="1337.535" fill="#000" font-size="15" textLength="14.238">   </text><text x="440.278" y="1337.535" fill="#000" font-size="15" textLength="173.247" filter="url(#byc5qf6hpxk0o2)">One shared Unix socket</text><text x="618.271" y="1337.535" fill="#000" font-size="15" textLength="14.238">   </text><text x="637.255" y="1337.535" fill="#000" font-size="15" textLength="115.825" filter="url(#byc5qf6hpxk0o3)">Human controls</text><text x="155.747" y="1355.201" fill="#000" font-size="15" textLength="546.445">Directory: broker:collab-clients, 0750. Socket: broker:collab-clients, 0660.</text><text x="155.747" y="1372.867" fill="#000" font-size="15" textLength="738.999">Broker UID 1002 / client GID 1003 are mapped by the shifted IPC volume; directory mounted at boot.</text><text x="155.747" y="1390.533" fill="#000" font-size="15" textLength="642.964">Read-only mount protects the socket path. It does not prevent sending socket requests.</text><text x="155.747" y="1408.199" fill="#000" font-size="15" textLength="743.752">Dev clients share access; this does not isolate Codex from Claude or other code running as their user.</text><text x="155.747" y="1425.865" fill="#000" font-size="15" textLength="812.761">Proposed workspace / agent-home volumes would survive replacement; current dev data stays on its root disk.</text><text x="155.747" y="1443.531" fill="#000" font-size="15" textLength="813.926">Writable host sharing changes host files. UID/GID isolation and noexec cannot prevent later host interpretation.</text><text x="155.747" y="1461.197" fill="#000" font-size="15" textLength="797.249">Shared broker is implemented. Independent workspace storage and agent-home migration remain proposed.</text></g></g></svg>