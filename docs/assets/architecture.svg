<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1115px;height:1555px;background:#FAFAFA;" width="1115px" height="1555px" viewBox="0 0 1115 1555" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="b19do8ft7zcluc0" x="0" y="0" width="1" height="1"><feFlood flood-color="#E7F5EB" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b19do8ft7zcluc1" x="0" y="0" width="1" height="1"><feFlood flood-color="#E3EFFF" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b19do8ft7zcluc2" x="0" y="0" width="1" height="1"><feFlood flood-color="#FCE4F0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b19do8ft7zcluc3" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1115" height="1555" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="4"><text x="263.46" y="87.17" fill="#000" font-size="25" textLength="586.499" font-weight="700">collab-ai · Shared broker and dev workspace</text></g><!--cluster Dev--><g class="cluster" data-qualified-name="Dev" id="ent0002" data-source-line="53"><rect x="31" y="310.793" width="532" height="977.09" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="186.316" y="338.262" fill="#000" font-size="16" textLength="221.367" font-weight="700">workspace · dev container</text></g><!--cluster Control--><g class="cluster" data-qualified-name="Control" id="ent0008" data-source-line="61"><rect x="634" y="310.793" width="428" height="688.29" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="734.676" y="338.262" fill="#000" font-size="16" textLength="226.648" font-weight="700">secured · control container</text></g><!--entity Codex--><g class="entity" data-qualified-name="Dev.Codex" id="ent0003" data-source-line="54"><rect x="46.88" y="367.793" width="236.234" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="66.88" y="407.129" fill="#000" font-size="20" textLength="63.809" font-weight="700">Codex</text><text x="66.88" y="426.817" fill="#000" font-size="16" textLength="193.633">Terminal + collab-codex</text><text x="66.88" y="445.661" fill="#000" font-size="16" textLength="196.234">Managed proxy / listener</text></g><!--entity Claude--><g class="entity" data-qualified-name="Dev.Claude" id="ent0004" data-source-line="55"><rect x="322.69" y="367.793" width="224.625" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="342.69" y="407.129" fill="#000" font-size="20" textLength="129.199" font-weight="700">Claude Code</text><text x="342.69" y="426.817" fill="#000" font-size="16" textLength="180.016">Terminal + collab-mcp</text><text x="342.69" y="445.661" fill="#000" font-size="16" textLength="184.625">MCP over stdin / stdout</text></g><!--entity Project--><g class="entity" data-qualified-name="Dev.Project" id="ent0005" data-source-line="56"><rect x="56.64" y="825.653" width="418.711" height="204.617" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="76.64" y="864.989" fill="#000" font-size="20" textLength="220.313" font-weight="700">Persistent workspace</text><text x="76.64" y="884.677" fill="#000" font-size="16" textLength="310.617">/workspace · independent Incus volume</text><text x="76.64" y="903.521" fill="#000" font-size="16" textLength="253.32">Optional: selected host directory</text><text x="76.64" y="922.364" fill="#000" font-size="16" textLength="369.641">Host mount: read-only unless opted into writes</text><line x1="57.64" y1="935.739" x2="474.351" y2="935.739" style="stroke:#181818;stroke-width:1;"/><text x="76.64" y="965.208" fill="#000" font-size="16" textLength="335.75">Sandbox data owned by agent (1001:1001)</text><text x="76.64" y="984.052" fill="#000" font-size="16" textLength="309.742">Dedicated host-sharing identity · future</text><text x="76.64" y="1002.896" fill="#000" font-size="16" textLength="378.711">Run shell commands, builds and tests inside dev</text></g><!--entity AgentHome--><g class="entity" data-qualified-name="Dev.AgentHome" id="ent0006" data-source-line="57"><path d="M46.52,1069.763 L46.52,1269.381 A2.5,2.5 0 0 0 49.02,1271.881 L504.989,1271.881 A2.5,2.5 0 0 0 507.489,1269.381 L507.489,1077.263 L497.489,1067.263 L49.02,1067.263 A2.5,2.5 0 0 0 46.52,1069.763" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><path d="M497.489,1067.263 L497.489,1074.763 A2.5,2.5 0 0 0 499.989,1077.263 L507.489,1077.263" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><text x="66.52" y="1106.599" fill="#000" font-size="20" textLength="231.377" font-weight="700">Persistent agent home</text><text x="66.52" y="1126.287" fill="#000" font-size="16" textLength="321.531">/home/agent on a separate Incus volume</text><text x="66.52" y="1145.131" fill="#000" font-size="16" textLength="242.133">Survives container replacement</text><text x="66.52" y="1163.974" fill="#000" font-size="16" textLength="420.969">Codex + Claude settings, skills, memory and sessions</text><line x1="47.52" y1="1177.349" x2="506.489" y2="1177.349" style="stroke:#181818;stroke-width:1;"/><text x="66.52" y="1206.818" fill="#000" font-size="16" textLength="287.898">Agents update sandbox-owned state</text><text x="66.52" y="1225.662" fill="#000" font-size="16" textLength="329.617">Selected host-state import tooling · future</text><text x="66.52" y="1244.506" fill="#000" font-size="16" textLength="184.688">No live host-home sync</text></g><!--entity Socket--><g class="entity" data-qualified-name="Dev.Socket" id="ent0007" data-source-line="58"><path d="M64.85,547.533 L64.85,747.151 A2.5,2.5 0 0 0 67.35,749.651 L406.655,749.651 A2.5,2.5 0 0 0 409.155,747.151 L409.155,555.033 L399.155,545.033 L67.35,545.033 A2.5,2.5 0 0 0 64.85,547.533" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><path d="M399.155,545.033 L399.155,552.533 A2.5,2.5 0 0 0 401.655,555.033 L409.155,555.033" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><text x="84.85" y="584.369" fill="#000" font-size="20" textLength="266.846" font-weight="700">broker.sock · Unix socket</text><text x="84.85" y="604.057" fill="#000" font-size="16" textLength="226.203">/mnt/collab-ipc/broker.sock</text><text x="84.85" y="622.901" fill="#000" font-size="16" textLength="296.469">Directory mounted READ-ONLY in dev</text><text x="84.85" y="641.744" fill="#000" font-size="16" textLength="289.063">Owner: broker · group: collab-clients</text><text x="84.85" y="660.588" fill="#000" font-size="16" textLength="150.297">Socket mode: 0660</text><line x1="65.85" y1="673.963" x2="408.155" y2="673.963" style="stroke:#181818;stroke-width:1;"/><text x="84.85" y="703.432" fill="#000" font-size="16" textLength="304.305">Clients may connect and send requests</text><text x="84.85" y="722.276" fill="#000" font-size="16" textLength="286.047">Cannot replace or remove the socket</text></g><!--entity Dashboard--><g class="entity" data-qualified-name="Control.Dashboard" id="ent0009" data-source-line="62"><rect x="650.47" y="367.793" width="287.063" height="101.242" fill="#FFF3B0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="670.47" y="407.129" fill="#000" font-size="20" textLength="163.955" font-weight="700">Human controls</text><text x="670.47" y="426.817" fill="#000" font-size="16" textLength="247.063">collab dashboard · collab status</text><text x="670.47" y="445.661" fill="#000" font-size="16" textLength="211.711">Operator settings stay here</text></g><!--entity Broker--><g class="entity" data-qualified-name="Control.Broker" id="ent0010" data-source-line="63"><rect x="703.47" y="596.723" width="289.063" height="101.242" fill="#E3EFFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="723.47" y="636.059" fill="#000" font-size="20" textLength="215.557" font-weight="700">One collab-ai broker</text><text x="723.47" y="655.747" fill="#000" font-size="16" textLength="249.063">Creates / listens on broker.sock</text><text x="723.47" y="674.591" fill="#000" font-size="16" textLength="234.484">Only process accessing SQLite</text></g><!--entity DB--><g class="entity" data-qualified-name="Control.DB" id="ent0011" data-source-line="64"><path d="M650.28,882.833 C650.28,872.833 848,872.833 848,872.833 C848,872.833 1045.719,872.833 1045.719,882.833 L1045.719,973.076 C1045.719,983.076 848,983.076 848,983.076 C848,983.076 650.28,983.076 650.28,973.076 L650.28,882.833" style="stroke:#181818;stroke-width:0.5;" fill="#E3EFFF"/><path d="M650.28,882.833 C650.28,892.833 848,892.833 848,892.833 C848,892.833 1045.719,892.833 1045.719,882.833" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="670.28" y="926.169" fill="#000" font-size="20" textLength="355.439" font-weight="700">One collaboration SQLite database</text><text x="670.28" y="945.857" fill="#000" font-size="16" textLength="195.953">Private persistent volume</text><text x="670.28" y="964.701" fill="#000" font-size="16" textLength="171.078">Never mounted in dev</text></g><!--entity Human--><g class="entity" data-qualified-name="Human" id="ent0001" data-source-line="51"><ellipse cx="435.005" cy="146.443" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M435.005,154.443 L435.005,181.443 M422.005,162.443 L448.005,162.443 M435.005,181.443 L422.005,196.443 M435.005,181.443 L448.005,196.443" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="356.79" y="223.412" fill="#000" font-size="16" textLength="156.43">You · host terminals</text></g><!--