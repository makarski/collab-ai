ne="62"><rect x="995" y="562.033" width="428" height="478.36" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="1095.676" y="589.502" fill="#000" font-size="16" textLength="226.648" font-weight="700">secured · control container</text><text x="1084.336" y="608.346" fill="#000" font-size="16" textLength="249.328" font-weight="700">Offline · no network interface</text></g><!--entity Dashboard--><g class="entity" data-qualified-name="Dev.Dashboard" id="ent0003" data-source-line="54"><rect x="47" y="386.783" width="368.008" height="101.242" fill="#FFF3B0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="67" y="426.119" fill="#000" font-size="20" textLength="223.545" font-weight="700">Read-only dashboard</text><text x="67" y="445.807" fill="#000" font-size="16" textLength="247.063">collab dashboard · collab status</text><text x="67" y="464.651" fill="#000" font-size="16" textLength="328.008">Agent connections and pending messages</text></g><!--entity Codex--><g class="entity" data-qualified-name="Dev.Codex" id="ent0004" data-source-line="55"><rect x="454.88" y="386.783" width="236.234" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="474.88" y="426.119" fill="#000" font-size="20" textLength="63.809" font-weight="700">Codex</text><text x="474.88" y="445.807" fill="#000" font-size="16" textLength="193.633">Terminal + collab-codex</text><text x="474.88" y="464.651" fill="#000" font-size="16" textLength="196.234">Managed proxy / listener</text></g><!--entity Claude--><g class="entity" data-qualified-name="Dev.Claude" id="ent0005" data-source-line="56"><rect x="730.69" y="386.783" width="224.625" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="750.69" y="426.119" fill="#000" font-size="20" textLength="129.199" font-weight="700">Claude Code</text><text x="750.69" y="445.807" fill="#000" font-size="16" textLength="180.016">Terminal + collab-mcp</text><text x="750.69" y="464.651" fill="#000" font-size="16" textLength="184.625">MCP over stdin / stdout</text></g><!--entity Project--><g class="entity" data-qualified-name="Dev.Project" id="ent0006" data-source-line="57"><rect x="368.64" y="866.963" width="418.711" height="204.617" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="388.64" y="906.299" fill="#000" font-size="20" textLength="220.313" font-weight="700">Persistent workspace</text><text x="388.64" y="925.987" fill="#000" font-size="16" textLength="310.617">/workspace · independent Incus volume</text><text x="388.64" y="944.831" fill="#000" font-size="16" textLength="253.32">Optional: selected host directory</text><text x="388.64" y="963.674" fill="#000" font-size="16" textLength="220.094">Mac host mounts: read-only</text><line x1="369.64" y1="977.049" x2="786.351" y2="977.049" style="stroke:#181818;stroke-width:1;"/><text x="388.64" y="1006.518" fill="#000" font-size="16" textLength="335.75">Sandbox data owned by agent (1001:1001)</text><text x="388.64" y="1025.362" fill="#000" font-size="16" textLength="352.43">Linux writes: dedicated host-sharing account</text><text x="388.64" y="1044.206" fill="#000" font-size="16" textLength="378.711">Run shell commands, builds and tests inside dev</text></g><!--entity AgentHome--><g class="entity" data-qualified-name="Dev.AgentHome" id="ent0007" data-source-line="58"><path d="M347.52,1111.073 L347.52,1310.691 A2.5,2.5 0 0 0 350.02,1313.191 L805.989,1313.191 A2.5,2.5 0 0 0 808.489,1310.691 L808.489,1118.573 L798.489,1108.573 L350.02,1108.573 A2.5,2.5 0 0 0 347.52,1111.073" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><path d="M798.489,1108.573 L798.489,1116.073 A2.5,2.5 0 0 0 800.989,1118.573 L808.489,1118.573" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><text x="367.52" y="1147.909" fill="#000" font-size="20" textLength="231.377" font-weight="700">Persistent agent home</text><text x="367.52" y="1167.597" fill="#000" font-size="16" textLength="321.531">/home/agent on a separate Incus volume</text><text x="367.52" y="1186.441" fill="#000" font-size="16" textLength="242.133">Survives container replacement</text><text x="367.52" y="1205.284" fill="#000" font-size="16" textLength="420.969">Codex + Claude settings, skills, memory and sessions</text><line x1="348.52" y1="1218.659" x2="807.489" y2="1218.659" style="stroke:#181818;stroke-width:1;"/><text x="367.52" y="1248.128" fill="#000" font-size="16" textLength="287.898">Agents update sandbox-owned state</text><text x="367.52" y="1266.972" fill="#000" font-size="16" textLength="329.617">Selected host-state import tooling · future</text><text x="367.52" y="1285.816" fill="#000" font-size="16" textLength="184.688">No live host-home sync</text></g><!--entity Socket--><g class="entity" data-qualified-name="Dev.Socket" id="ent0008" data-source-line="59"><path d="M405.85,588.843 L405.85,788.461 A2.5,2.5 0 0 0 408.35,790.961 L747.655,790.961 A2.5,2.5 0 0 0 750.155,788.461 L750.155,596.343 L740.155,586.343 L408.35,586.343 A2.5,2.5 0 0 0 405.85,588.843" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><path d="M740.155,586.343 L740.155,593.843 A2.5,2.5 0 0 0 742.655,596.343 L750.155,596.343" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><text x="425.85" y="625.679" fill="#000" font-size="20" textLength="266.846" font-weight="700">broker.sock · Unix socket</text><text x="425.85" y="645.367" fill="#000" font-size="16" textLength="226.203">/mnt/collab-ipc/broker.sock</text><text x="425.85" y="664.211" fill="#000" font-size="16" textLength="296.469">Directory mounted READ-ONLY in dev</text><text x="425.85" y="683.054" fill="#000" font-size="16" textLength="289.063">Owner: broker · group: collab-clients</text><text x="425.85" y="701.898" fill="#000" font-size="16" textLength="150.297">Socket mode: 0660</text><line x1="406.85" y1="715.273" x2="749.155" y2="715.273" style="stroke:#181818;stroke-width:1;"/><text x="425.85" y="744.742" fill="#000" font-size="16" textLength="304.305">Clients may connect and send requests</text><text x="425.85" y="763.586" fill="#000" font-size="16" textLength="286.047">Cannot replace or remove the socket</text></g><!--entity Broker--><g class="entity" data-qualified-name="Control.Broker" id="ent0010" data-source-line="63"><rect x="1056.47" y="638.033" width="289.063" height="101.242" fill="#E3EFFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1076.47" y="677.369" fill="#000" font-size="20" textLength="215.557" font-weight="700">One collab-ai broker</text><text x="1076.47" y="697.057" fill="#000" font-size="16" textLength="249.063">Creates / listens on broker.sock</text><text x="1076.47" y="715.901" fill="#000" font-size="16" textLength="234.484">Only process accessing SQLite</text></g><!--entity DB--><g class="entity" data-qualified-name="Control.DB" id="ent0011" data-source-line="64"><path d="M1011.28,924.143 C1011.28,914.143 1209,914.143 1209,914.143 C1209,914.143 1406.719,914.143 1406.719,924.143 L1406.719,1014.386 C1406.719,1024.386 1209,1024.386 1209,1024.386 C1209,1024.386 1011.28,1024.386 1011.28,1014.386 L1011.28,924.143" style="stroke:#181818;stroke-width:0.5;" fill="#E3EFFF"/><path d="M1011.28,924.143 C1011.28,934.143 1209,934.143 1209,934.143 C1209,934.143 1406.719,934.143 1406.719,924.143" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="1031.28" y="967.479" fill="#000" font-size="20" textLength="355.439" font-weight="700">One collaboration SQLite database</text><text x="1031.28" y="987.167" fill="#000" font-size="16" textLength="195.953">Private persistent volume</text><text x="1031.28" y="1006.011" fill="#000" font-size="16" textLength="171.078">Never mounted in dev</text></g><!--entity Human--><g class="entity" data-qualified-name="Human" id="ent0001" data-source-line="51"><ellipse cx="573.005" cy="146.443" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M573.005,154.443 L573.005,181.443 M560.005,162.443 L586.005,162.443 M573.005,181.443 L560.005,196.443 M573.005,181.443 L586.005,196.443" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="494.79" y="223.412" fill="#000" font-size="16" textLength="156.43">You · host terminals</text></g><!--link Human to Codex--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk12" data-source-line="67" data-link-type="dependency"><path d="M573,237.073 C573,280.243 573,338.013 573,381.533" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Codex"/><polygon points="573,386.533,577,377.533,573,381.533,569,377.533,573,386.533" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="584" y="281.252" fill="#000" font-size="16" textLength="180.016">SSH · prompts / output</text></g><!--link Human to Claude--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk13" data-source-line="68" data-link-type="dependency"><path d="M661.67,197.163 C703.95,205.653 752.32,222.283 785,254.783 C820.09,289.683 833.3,340.808 838.79,381.428" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Claude"/><polygon points="839.46,386.383,842.219,376.929,838.79,381.428,834.291,378,839.46,386.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="822.78" y="281.252" fill="#000" font-size="16" textLength="180.016">SSH · prompts / output</text></g><!--link Human to Dashboard--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk14" data-source-line="69" data-link-type="dependency"><path d="M484.61,207.953 C450.27,218.273 411.86,233.363 381,254.783 C330.78,289.653 290.817,341.562 263.957,382.192" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Dashboard"/><polygon points="261.2,386.363,269.5,381.062,263.957,382.192,262.826,376.65,261.2,386.363" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="392" y="281.252" fill="#000" font-size="16" textLength="160.688">SSH · terminal status</text></g><!--link Codex to Socket--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" id="lnk15" data-source-line="71" data-link-type="dependency"><path d="M574,488.243 C574.56,516.233 575.179,547.204 575.859,580.874" style="stroke:#181818;stroke-width:1;" fill="none" id="Codex-to-Socket"/><polygon points="575.96,585.873,579.777,576.794,575.859,580.874,571.779,576.956,575.96,585.873" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="586.05" y="532.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Claude to Socket--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk16" data-source-line="72" data-link-type="dependency"><path d="M790.01,488.243 C760.25,516.233 725.652,548.778 689.852,582.448" style="stroke:#181818;stroke-width:1;" fill="none" id="Claude-to-Socket"/><polygon points="686.21,585.873,695.506,582.621,689.852,582.448,690.026,576.794,686.21,585.873" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="775.7" y="532.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Socket to Project--><!--link Project to AgentHome--><!--link Dashboard to Socket--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" id="lnk19" data-source-line="76" data-link-type="dependency"><path d="M276.2,488.523 C294.7,507.643 316.93,528.923 339,546.033 C359.78,562.133 378.328,575.099 401.288,589.789" style="stroke:#181818;stroke-width:1;" fill="none" id="Dashboard-to-Socket"/><polygon points="405.5,592.483,400.075,584.264,401.288,589.789,395.763,591.002,405.5,592.483" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="350" y="532.502" fill="#000" font-size="16" textLength="203.781">Read-only status requests</text></g><!--link Socket to Broker--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" id="lnk21" data-source-line="77" data-link-type="dependency"><path d="M755.3,688.653 C851.46,688.653 959.89,688.653 1051.22,688.653" style="stroke:#181818;stroke-width:1;" fill="none" id="Socket-Broker"/><polygon points="750.3,688.653,759.3,692.653,755.3,688.653,759.3,684.653,750.3,688.653" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="1056.22,688.653,1047.22,684.653,1051.22,688.653,1047.22,692.653,1056.22,688.653" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="800.451" y="634.122" fill="#000" font-size="16" textLength="206.281">Same shared Incus volume</text><text x="840.611" y="652.966" fill="#000" font-size="16" textLength="125.961">/mnt/collab-ipc</text><text x="786.81" y="671.81" fill="#000" font-size="16" textLength="233.563">READ-WRITE mount in control</text></g><!--link Broker to DB--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk22" data-source-line="78" data-link-type="dependency"><path d="M1202.43,739.463 C1203.84,788.613 1205.846,858.535 1207.306,909.135" style="stroke:#181818;stroke-width:1;" fill="none" id="Broker-to-DB"/><polygon points="1207.45,914.133,1211.189,905.022,1207.306,909.135,1203.192,905.252,1207.45,914.133" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1216.48" y="835.432" fill="#000" font-size="16" textLength="94.852">Read / write</text></g><g class="legend" data-source-line="80"><rect x="289.449" y="1361.193" width="875.101" height="185.328" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="316.196" y="1397.695" fill="#000" font-size="15" textLength="99.324" filter="url(#bz9n1oesqr8fb0)">Agents in dev</text><text x="420.265" y="1397.695" fill="#000" font-size="15" textLength="14.238">   </text><text x="439.25" y="1397.695" fill="#000" font-size="15" textLength="133" filter="url(#bz9n1oesqr8fb1)">Services in control</text><text x="576.996" y="1397.695" fill="#000" font-size="15" textLength="14.238">   </text><text x="595.981" y="1397.695" fill="#000" font-size="15" textLength="173.247" filter="url(#bz9n1oesqr8fb2)">One shared Unix socket</text><text x="773.974" y="1397.695" fill="#000" font-size="15" textLength="14.238">   </text><text x="792.958" y="1397.695" fill="#000" font-size="15" textLength="156.885" filter="url(#bz9n1oesqr8fb3)">Read-only dashboard</text><text x="311.449" y="1415.361" fill="#000" font-size="15" textLength="546.445">Directory: broker:collab-clients, 0750. Socket: broker:collab-clients, 0660.</text><text x="311.449" y="1433.027" fill="#000" font-size="15" textLength="738.999">Broker UID 1002 / client GID 1003 are mapped by the shifted IPC volume; directory mounted at boot.</text><text x="311.449" y="1450.693" fill="#000" font-size="15" textLength="642.964">Read-only mount protects the socket path. It does not prevent sending socket requests.</text><text x="311.449" y="1468.359" fill="#000" font-size="15" textLength="743.752">Dev clients share access; this does not isolate Codex from Claude or other code running as their user.</text><text x="311.449" y="1486.025" fill="#000" font-size="15" textLength="831.101">Workspace and agent-home volumes survive replacement; Terraform blocks their deletion until explicitly allowed.</text><text x="311.449" y="1503.691" fill="#000" font-size="15" textLength="772.434">Host mounts do not prevent execution. Writable sharing allows changes to host scripts and configuration.</text><text x="311.449" y="1521.357" fill="#000" font-size="15" textLength="588.633">Host-state import remains future work. File retention is not a resume guarantee.</text></g></g></svg>