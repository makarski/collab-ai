t x="796.406" y="338.252" fill="#000" font-size="16" textLength="141.188" font-weight="700">control container</text></g><!--entity Codex--><g class="entity" data-qualified-name="Dev.Codex" id="ent0003" data-source-line="54"><rect x="46.88" y="367.783" width="236.234" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="66.88" y="407.119" fill="#000" font-size="20" textLength="63.809" font-weight="700">Codex</text><text x="66.88" y="426.807" fill="#000" font-size="16" textLength="193.633">Terminal + collab-codex</text><text x="66.88" y="445.651" fill="#000" font-size="16" textLength="196.234">Managed proxy / listener</text></g><!--entity Claude--><g class="entity" data-qualified-name="Dev.Claude" id="ent0004" data-source-line="55"><rect x="322.69" y="367.783" width="224.625" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="342.69" y="407.119" fill="#000" font-size="20" textLength="129.199" font-weight="700">Claude Code</text><text x="342.69" y="426.807" fill="#000" font-size="16" textLength="180.016">Terminal + collab-mcp</text><text x="342.69" y="445.651" fill="#000" font-size="16" textLength="184.625">MCP over stdin / stdout</text></g><!--entity Project--><g class="entity" data-qualified-name="Dev.Project" id="ent0005" data-source-line="56"><rect x="47.3" y="825.643" width="491.406" height="185.773" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="67.3" y="864.979" fill="#000" font-size="20" textLength="451.406" font-weight="700">Project workspace · /workspace/&lt;project></text><text x="67.3" y="884.667" fill="#000" font-size="16" textLength="338.313">Default: persistent Incus workspace volume</text><text x="67.3" y="903.511" fill="#000" font-size="16" textLength="253.32">Optional: selected host directory</text><text x="67.3" y="922.354" fill="#000" font-size="16" textLength="369.641">Host mount: read-only unless opted into writes</text><line x1="48.3" y1="935.729" x2="537.706" y2="935.729" style="stroke:#181818;stroke-width:1;"/><text x="67.3" y="965.198" fill="#000" font-size="16" textLength="423.016">Dedicated sandbox UID/GID; no personal host identity</text><text x="67.3" y="984.042" fill="#000" font-size="16" textLength="378.711">Run shell commands, builds and tests inside dev</text></g><!--entity AgentHome--><g class="entity" data-qualified-name="Dev.AgentHome" id="ent0006" data-source-line="57"><path d="M60.01,1050.923 L60.01,1231.697 A2.5,2.5 0 0 0 62.51,1234.197 L523.487,1234.197 A2.5,2.5 0 0 0 525.987,1231.697 L525.987,1058.423 L515.987,1048.423 L62.51,1048.423 A2.5,2.5 0 0 0 60.01,1050.923" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><path d="M515.987,1048.423 L515.987,1055.923 A2.5,2.5 0 0 0 518.487,1058.423 L525.987,1058.423" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><text x="80.01" y="1087.759" fill="#000" font-size="20" textLength="394.883" font-weight="700">Persistent agent home · /home/agent</text><text x="80.01" y="1107.447" fill="#000" font-size="16" textLength="425.977">Separate Incus volume; survives container replacement</text><text x="80.01" y="1126.291" fill="#000" font-size="16" textLength="420.969">Codex + Claude settings, skills, memory and sessions</text><line x1="61.01" y1="1139.666" x2="524.987" y2="1139.666" style="stroke:#181818;stroke-width:1;"/><text x="80.01" y="1169.134" fill="#000" font-size="16" textLength="337.242">Import selected host config / memory once</text><text x="80.01" y="1187.978" fill="#000" font-size="16" textLength="287.898">Agents update sandbox-owned state</text><text x="80.01" y="1206.822" fill="#000" font-size="16" textLength="380.719">Explicit backup / export; no live host-home sync</text></g><!--entity Socket--><g class="entity" data-qualified-name="Dev.Socket" id="ent0007" data-source-line="58"><path d="M83.85,547.533 L83.85,747.151 A2.5,2.5 0 0 0 86.35,749.651 L425.655,749.651 A2.5,2.5 0 0 0 428.155,747.151 L428.155,555.033 L418.155,545.033 L86.35,545.033 A2.5,2.5 0 0 0 83.85,547.533" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><path d="M418.155,545.033 L418.155,552.533 A2.5,2.5 0 0 0 420.655,555.033 L428.155,555.033" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><text x="103.85" y="584.369" fill="#000" font-size="20" textLength="266.846" font-weight="700">broker.sock · Unix socket</text><text x="103.85" y="604.057" fill="#000" font-size="16" textLength="221.758">/run/collab-ipc/broker.sock</text><text x="103.85" y="622.901" fill="#000" font-size="16" textLength="296.469">Directory mounted READ-ONLY in dev</text><text x="103.85" y="641.744" fill="#000" font-size="16" textLength="289.063">Owner: broker · group: collab-clients</text><text x="103.85" y="660.588" fill="#000" font-size="16" textLength="150.297">Socket mode: 0660</text><line x1="84.85" y1="673.963" x2="427.155" y2="673.963" style="stroke:#181818;stroke-width:1;"/><text x="103.85" y="703.432" fill="#000" font-size="16" textLength="304.305">Clients may connect and send requests</text><text x="103.85" y="722.276" fill="#000" font-size="16" textLength="286.047">Cannot replace or remove the socket</text></g><!--entity Dashboard--><g class="entity" data-qualified-name="Control.Dashboard" id="ent0009" data-source-line="62"><rect x="669.47" y="367.783" width="287.063" height="101.242" fill="#FFF3B0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="689.47" y="407.119" fill="#000" font-size="20" textLength="163.955" font-weight="700">Human controls</text><text x="689.47" y="426.807" fill="#000" font-size="16" textLength="247.063">collab dashboard · collab status</text><text x="689.47" y="445.651" fill="#000" font-size="16" textLength="211.711">Operator settings stay here</text></g><!--entity Broker--><g class="entity" data-qualified-name="Control.Broker" id="ent0010" data-source-line="63"><rect x="722.47" y="596.713" width="289.063" height="101.242" fill="#E3EFFF" style="s