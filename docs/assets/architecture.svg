pendency"><path d="M180.8,469.523 C186.53,487.643 193.05,508.263 199,527.033 C200.84,532.833 201.216,534.028 203.126,540.038" style="stroke:#181818;stroke-width:1;" fill="none" id="Codex-to-Socket"/><polygon points="204.64,544.803,205.726,535.015,203.126,540.038,198.102,537.438,204.64,544.803" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="210" y="513.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Claude to Socket--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk16" data-source-line="72" data-link-type="dependency"><path d="M395.08,469.483 C380.22,487.793 363.06,508.533 347,527.033 C341.92,532.883 339.987,535.121 334.647,541.111" style="stroke:#181818;stroke-width:1;" fill="none" id="Claude-to-Socket"/><polygon points="331.32,544.843,340.295,540.787,334.647,541.111,334.323,535.464,331.32,544.843" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="390.06" y="513.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Socket to Project--><!--link Project to AgentHome--><!--link Dashboard to Broker--><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" id="lnk19" data-source-line="76" data-link-type="dependency"><path d="M805.92,469.493 C814.89,507.213 825.982,553.829 834.952,591.519" style="stroke:#181818;stroke-width:1;" fill="none" id="Dashboard-to-Broker"/><polygon points="836.11,596.383,837.918,586.702,834.952,591.519,830.135,588.554,836.11,596.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="830.38" y="513.502" fill="#000" font-size="16" textLength="240.039">Queries via the same local UDS</text></g><!--link Socket to Broker--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" id="lnk21" data-source-line="77" data-link-type="dependency"><path d="M414.64,647.343 C507.27,647.343 610.15,647.343 698.16,647.343" style="stroke:#181818;stroke-width:1;" fill="none" id="Socket-Broker"/><polygon points="409.64,647.343,418.64,651.343,414.64,647.343,418.64,643.343,409.64,647.343" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="703.16,647.343,694.16,643.343,698.16,647.343,694.16,651.343,703.16,647.343" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="453.451" y="592.812" fill="#000" font-size="16" textLength="206.281">Same shared Incus volume</text><text x="493.611" y="611.656" fill="#000" font-size="16" textLength="125.961">/mnt/collab-ipc</text><text x="439.81" y="630.5" fill="#000" font-size="16" textLength="233.563">READ-WRITE mount in control</text></g><!--link Broker to DB--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk22" data-source-line="78" data-link-type="dependency"><path d="M848,698.153 C848,747.303 848,817.223 848,867.823" style="stroke:#181818;stroke-width:1;" fill="none" id="Broker-to-DB"/><polygon points="848,872.823,852,863.823,848,867.823,844,863.823,848,872.823" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="859" y="794.122" fill="#000" font-size="16" textLength="94.852">Read / write</text></g><g class="legend" data-source-line="80"><rect x="104.646" y="1319.883" width="904.127" height="185.328" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="131.392" y="1356.385" fill="#000" font-size="15" textLength="99.324" filter="url(#b19do8ft7zcluc0)">Agents in dev</text><text x="235.462" y="1356.385" fill="#000" font-size="15" textLength="14.238">   </text><text x="254.446" y="1356.385" fill="#000" font-size="15" textLength="133" filter="url(#b19do8ft7zcluc1)">Services in control</text><text x="392.193" y="1356.385" fill="#000" font-size="15" textLength="14.238">   </text><text x="411.177" y="1356.385" fill="#000" font-size="15" textLength="173.247" filter="url(#b19do8ft7zcluc2)">One shared Unix socket</text><text x="589.17" y="1356.385" fill="#000" font-size="15" textLength="14.238">   </text><text x="608.155" y="1356.385" fill="#000" font-size="15" textLength="115.825" filter="url(#b19do8ft7zcluc3)">Human controls</text><text x="126.646" y="1374.051" fill="#000" font-size="15" textLength="546.445">Directory: broker:collab-clients, 0750. Socket: broker:collab-clients, 0660.</text><text x="126.646" y="1391.717" fill="#000" font-size="15" textLength="738.999">Broker UID 1002 / client GID 1003 are mapped by the shifted IPC volume; directory mounted at boot.</text><text x="126.646" y="1409.383" fill="#000" font-size="15" textLength="642.964">Read-only mount protects the socket path. It does not prevent sending socket requests.</text><text x="126.646" y="1427.049" fill="#000" font-size="15" textLength="743.752">Dev clients share access; this does not isolate Codex from Claude or other code running as their user.</text><text x="126.646" y="1444.715" fill="#000" font-size="15" textLength="831.101">Workspace and agent-home volumes survive replacement; Terraform blocks their deletion until explicitly allowed.</text><text x="126.646" y="1462.381" fill="#000" font-size="15" textLength="813.926">Writable host sharing changes host files. UID/GID isolation and noexec cannot prevent later host interpretation.</text><text x="126.646" y="1480.047" fill="#000" font-size="15" textLength="860.127">Host-state import and dedicated host-sharing identities remain future work. File retention is not a resume guarantee.</text></g></g></svg>