<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1115px;height:1574px;background:#FAFAFA;" width="1115px" height="1574px" viewBox="0 0 1115 1574" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="bwtp5i7alx9lz0" x="0" y="0" width="1" height="1"><feFlood flood-color="#E7F5EB" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="bwtp5i7alx9lz1" x="0" y="0" width="1" height="1"><feFlood flood-color="#E3EFFF" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="bwtp5i7alx9lz2" x="0" y="0" width="1" height="1"><feFlood flood-color="#FCE4F0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="bwtp5i7alx9lz3" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3B0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1115" height="1574" fill="#FAFAFA" style="stroke:none;"/><g class="title" data-source-line="4"><text x="263.46" y="87.17" fill="#000" font-size="25" textLength="586.499" font-weight="700">collab-ai · Shared broker and dev workspace</text></g><!--cluster Dev--><g class="cluster" data-qualified-name="Dev" id="ent0002" data-source-line="53"><rect x="31" y="310.793" width="532" height="996.09" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="186.316" y="338.262" fill="#000" font-size="16" textLength="221.367" font-weight="700">workspace · dev container</text><text x="106.242" y="357.106" fill="#000" font-size="16" textLength="381.516" font-weight="700">Network access by default · opt-out available</text></g><!--cluster Control--><g class="cluster" data-qualified-name="Control" id="ent0008" data-source-line="61"><rect x="634" y="310.793" width="428" height="707.29" fill="none" style="stroke:#808080;stroke-width:2;stroke-dasharray:5,5;" rx="2.5" ry="2.5"/><text x="734.676" y="338.262" fill="#000" font-size="16" textLength="226.648" font-weight="700">secured · control container</text><text x="723.336" y="357.106" fill="#000" font-size="16" textLength="249.328" font-weight="700">Offline · no network interface</text></g><!--entity Codex--><g class="entity" data-qualified-name="Dev.Codex" id="ent0003" data-source-line="54"><rect x="46.88" y="386.793" width="236.234" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="66.88" y="426.129" fill="#000" font-size="20" textLength="63.809" font-weight="700">Codex</text><text x="66.88" y="445.817" fill="#000" font-size="16" textLength="193.633">Terminal + collab-codex</text><text x="66.88" y="464.661" fill="#000" font-size="16" textLength="196.234">Managed proxy / listener</text></g><!--entity Claude--><g class="entity" data-qualified-name="Dev.Claude" id="ent0004" data-source-line="55"><rect x="322.69" y="386.793" width="224.625" height="101.242" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="342.69" y="426.129" fill="#000" font-size="20" textLength="129.199" font-weight="700">Claude Code</text><text x="342.69" y="445.817" fill="#000" font-size="16" textLength="180.016">Terminal + collab-mcp</text><text x="342.69" y="464.661" fill="#000" font-size="16" textLength="184.625">MCP over stdin / stdout</text></g><!--entity Project--><g class="entity" data-qualified-name="Dev.Project" id="ent0005" data-source-line="56"><rect x="56.64" y="844.653" width="418.711" height="204.617" fill="#E7F5EB" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="76.64" y="883.989" fill="#000" font-size="20" textLength="220.313" font-weight="700">Persistent workspace</text><text x="76.64" y="903.677" fill="#000" font-size="16" textLength="310.617">/workspace · independent Incus volume</text><text x="76.64" y="922.521" fill="#000" font-size="16" textLength="253.32">Optional: selected host directory</text><text x="76.64" y="941.364" fill="#000" font-size="16" textLength="220.094">Mac host mounts: read-only</text><line x1="57.64" y1="954.739" x2="474.351" y2="954.739" style="stroke:#181818;stroke-width:1;"/><text x="76.64" y="984.208" fill="#000" font-size="16" textLength="335.75">Sandbox data owned by agent (1001:1001)</text><text x="76.64" y="1003.052" fill="#000" font-size="16" textLength="352.43">Linux writes: dedicated host-sharing account</text><text x="76.64" y="1021.896" fill="#000" font-size="16" textLength="378.711">Run shell commands, builds and tests inside dev</text></g><!--entity AgentHome--><g class="entity" data-qualified-name="Dev.AgentHome" id="ent0006" data-source-line="57"><path d="M46.52,1088.763 L46.52,1288.381 A2.5,2.5 0 0 0 49.02,1290.881 L504.989,1290.881 A2.5,2.5 0 0 0 507.489,1288.381 L507.489,1096.263 L497.489,1086.263 L49.02,1086.263 A2.5,2.5 0 0 0 46.52,1088.763" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><path d="M497.489,1086.263 L497.489,1093.763 A2.5,2.5 0 0 0 499.989,1096.263 L507.489,1096.263" style="stroke:#181818;stroke-width:0.5;" fill="#F0EAFF"/><text x="66.52" y="1125.599" fill="#000" font-size="20" textLength="231.377" font-weight="700">Persistent agent home</text><text x="66.52" y="1145.287" fill="#000" font-size="16" textLength="321.531">/home/agent on a separate Incus volume</text><text x="66.52" y="1164.131" fill="#000" font-size="16" textLength="242.133">Survives container replacement</text><text x="66.52" y="1182.974" fill="#000" font-size="16" textLength="420.969">Codex + Claude settings, skills, memory and sessions</text><line x1="47.52" y1="1196.349" x2="506.489" y2="1196.349" style="stroke:#181818;stroke-width:1;"/><text x="66.52" y="1225.818" fill="#000" font-size="16" textLength="287.898">Agents update sandbox-owned state</text><text x="66.52" y="1244.662" fill="#000" font-size="16" textLength="329.617">Selected host-state import tooling · future</text><text x="66.52" y="1263.506" fill="#000" font-size="16" textLength="184.688">No live host-home sync</text></g><!--entity Socket--><g class="entity" data-qualified-name="Dev.Socket" id="ent0007" data-source-line="58"><path d="M64.85,566.533 L64.85,766.151 A2.5,2.5 0 0 0 67.35,768.651 L406.655,768.651 A2.5,2.5 0 0 0 409.155,766.151 L409.155,574.033 L399.155,564.033 L67.35,564.033 A2.5,2.5 0 0 0 64.85,566.533" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><path d="M399.155,564.033 L399.155,571.533 A2.5,2.5 0 0 0 401.655,574.033 L409.155,574.033" style="stroke:#181818;stroke-width:0.5;" fill="#FCE4F0"/><text x="84.85" y="603.369" fill="#000" font-size="20" textLength="266.846" font-weight="700">broker.sock · Unix socket</text><text x="84.85" y="623.057" fill="#000" font-size="16" textLength="226.203">/mnt/collab-ipc/broker.sock</text><text x="84.85" y="641.901" fill="#000" font-size="16" textLength="296.469">Directory mounted READ-ONLY in dev</text><text x="84.85" y="660.744" fill="#000" font-size="16" textLength="289.063">Owner: broker · group: collab-clients</text><text x="84.85" y="679.588" fill="#000" font-size="16" textLength="150.297">Socket mode: 0660</text><line x1="65.85" y1="692.963" x2="408.155" y2="692.963" style="stroke:#181818;stroke-width:1;"/><text x="84.85" y="722.432" fill="#000" font-size="16" textLength="304.305">Clients may connect and send requests</text><text x="84.85" y="741.276" fill="#000" font-size="16" textLength="286.047">Cannot replace or remove the socket</text></g><!--entity Dashboard--><g class="entity" data-qualified-name="Control.Dashboard" id="ent0009" data-source-line="62"><rect x="650.47" y="386.793" width="287.063" height="101.242" fill="#FFF3B0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="670.47" y="426.129" fill="#000" font-size="20" textLength="163.955" font-weight="700">Human controls</text><text x="670.47" y="445.817" fill="#000" font-size="16" textLength="247.063">collab dashboard · collab status</text><text x="670.47" y="464.661" fill="#000" font-size="16" textLength="211.711">Operator settings stay here</text></g><!--entity Broker--><g class="entity" data-qualified-name="Control.Broker" id="ent0010" data-source-line="63"><rect x="703.47" y="615.723" width="289.063" height="101.242" fill="#E3EFFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="723.47" y="655.059" fill="#000" font-size="20" textLength="215.557" font-weight="700">One collab-ai broker</text><text x="723.47" y="674.747" fill="#000" font-size="16" textLength="249.063">Creates / listens on broker.sock</text><text x="723.47" y="693.591" fill="#000" font-size="16" textLength="234.484">Only process accessing SQLite</text></g><!--entity DB--><g class="entity" data-qualified-name="Control.DB" id="ent0011" data-source-line="64"><path d="M650.28,901.833 C650.28,891.833 848,891.833 848,891.833 C848,891.833 1045.719,891.833 1045.719,901.833 L1045.719,992.076 C1045.719,1002.076 848,1002.076 848,1002.076 C848,1002.076 650.28,1002.076 650.28,992.076 L650.28,901.833" style="stroke:#181818;stroke-width:0.5;" fill="#E3EFFF"/><path d="M650.28,901.833 C650.28,911.833 848,911.833 848,911.833 C848,911.833 1045.719,911.833 1045.719,901.833" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="670.28" y="945.169" fill="#000" font-size="20" textLength="355.439" font-weight="700">One collaboration SQLite database</text><text x="670.28" y="964.857" fill="#000" font-size="16" textLength="195.953">Private persistent volume</text><text x="670.28" y="983.701" fill="#000" font-size="16" textLength="171.078">Never mounted in dev</text></g><!--entity Human--><g class="entity" data-qualified-name="Human" id="ent0001" data-source-line="51"><ellipse cx="435.005" cy="146.443" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M435.005,154.443 L435.005,181.443 M422.005,162.443 L448.005,162.443 M435.005,181.443 L422.005,196.443 M435.005,181.443 L448.005,196.443" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="356.79" y="223.412" fill="#000" font-size="16" textLength="156.43">You · host terminals</text></g><!--link Human to Codex--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk12" data-source-line="67" data-link-type="dependency"><path d="M346.33,197.163 C304.05,205.653 255.68,222.283 223,254.793 C187.91,289.683 174.7,340.808 169.21,381.428" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Codex"/><polygon points="168.54,386.383,173.709,378,169.21,381.428,165.781,376.929,168.54,386.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="234" y="281.262" fill="#000" font-size="16" textLength="180.016">SSH · prompts / output</text></g><!--link Human to Claude--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk13" data-source-line="68" data-link-type="dependency"><path d="M435,237.073 C435,280.253 435,338.013 435,381.543" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Claude"/><polygon points="435,386.543,439,377.543,435,381.543,431,377.543,435,386.543" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="446" y="281.262" fill="#000" font-size="16" textLength="180.016">SSH · prompts / output</text></g><!--link Human to Dashboard--><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" id="lnk14" data-source-line="69" data-link-type="dependency"><path d="M523.71,203.923 C563.81,213.923 610.32,229.853 647,254.793 C697.32,288.993 736.457,341.254 762.467,382.154" style="stroke:#181818;stroke-width:1;" fill="none" id="Human-to-Dashboard"/><polygon points="765.15,386.373,763.696,376.632,762.467,382.154,756.945,380.925,765.15,386.373" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="701.76" y="281.262" fill="#000" font-size="16" textLength="216.055">Host-administered terminal</text></g><!--link Codex to Socket--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk15" data-source-line="71" data-link-type="dependency"><path d="M180.8,488.523 C186.53,506.643 193.05,527.263 199,546.033 C200.84,551.833 201.216,553.028 203.126,559.038" style="stroke:#181818;stroke-width:1;" fill="none" id="Codex-to-Socket"/><polygon points="204.64,563.803,205.726,554.015,203.126,559.038,198.102,556.438,204.64,563.803" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="210" y="532.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Claude to Socket--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk16" data-source-line="72" data-link-type="dependency"><path d="M395.08,488.483 C380.22,506.793 363.06,527.533 347,546.033 C341.92,551.883 339.987,554.121 334.647,560.111" style="stroke:#181818;stroke-width:1;" fill="none" id="Claude-to-Socket"/><polygon points="331.32,563.843,340.295,559.787,334.647,560.111,334.323,554.464,331.32,563.843" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="390.06" y="532.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Socket to Project--><!--link Project to AgentHome--><!--link Dashboard to Broker--><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" id="lnk19" data-source-line="76" data-link-type="dependency"><path d="M805.92,488.493 C814.89,526.213 825.982,572.829 834.952,610.519" style="stroke:#181818;stroke-width:1;" fill="none" id="Dashboard-to-Broker"/><polygon points="836.11,615.383,837.918,605.702,834.952,610.519,830.135,607.554,836.11,615.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="830.38" y="532.502" fill="#000" font-size="16" textLength="240.039">Queries via the same local UDS</text></g><!--link Socket to Broker--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" id="lnk21" data-source-line="77" data-link-type="dependency"><path d="M414.64,666.343 C507.27,666.343 610.15,666.343 698.16,666.343" style="stroke:#181818;stroke-width:1;" fill="none" id="Socket-Broker"/><polygon points="409.64,666.343,418.64,670.343,414.64,666.343,418.64,662.343,409.64,666.343" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="703.16,666.343,694.16,662.343,698.16,666.343,694.16,670.343,703.16,666.343" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="453.451" y="611.812" fill="#000" font-size="16" textLength="206.281">Same shared Incus volume</text><text x="493.611" y="630.656" fill="#000" font-size="16" textLength="125.961">/mnt/collab-ipc</text><text x="439.81" y="649.5" fill="#000" font-size="16" textLength="233.563">READ-WRITE mount in control</text></g><!--link Broker to DB--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk22" data-source-line="78" data-link-type="dependency"><path d="M848,717.153 C848,766.303 848,836.223 848,886.823" style="stroke:#181818;stroke-width:1;" fill="none" id="Broker-to-DB"/><polygon points="848,891.823,852,882.823,848,886.823,844,882.823,848,891.823" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="859" y="813.122" fill="#000" font-size="16" textLength="94.852">Read / write</text></g><g class="legend" data-source-line="80"><rect x="119.159" y="1338.883" width="875.101" height="185.328" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="145.905" y="1375.385" fill="#000" font-size="15" textLength="99.324" filter="url(#bwtp5i7alx9lz0)">Agents in dev</text><text x="249.975" y="1375.385" fill="#000" font-size="15" textLength="14.238">   </text><text x="268.959" y="1375.385" fill="#000" font-size="15" textLength="133" filter="url(#bwtp5i7alx9lz1)">Services in control</text><text x="406.706" y="1375.385" fill="#000" font-size="15" textLength="14.238">   </text><text x="425.69" y="1375.385" fill="#000" font-size="15" textLength="173.247" filter="url(#bwtp5i7alx9lz2)">One shared Unix socket</text><text x="603.683" y="1375.385" fill="#000" font-size="15" textLength="14.238">   </text><text x="622.668" y="1375.385" fill="#000" font-size="15" textLength="115.825" filter="url(#bwtp5i7alx9lz3)">Human controls</text><text x="141.159" y="1393.051" fill="#000" font-size="15" textLength="546.445">Directory: broker:collab-clients, 0750. Socket: broker:collab-clients, 0660.</text><text x="141.159" y="1410.717" fill="#000" font-size="15" textLength="738.999">Broker UID 1002 / client GID 1003 are mapped by the shifted IPC volume; directory mounted at boot.</text><text x="141.159" y="1428.383" fill="#000" font-size="15" textLength="642.964">Read-only mount protects the socket path. It does not prevent sending socket requests.</text><text x="141.159" y="1446.049" fill="#000" font-size="15" textLength="743.752">Dev clients share access; this does not isolate Codex from Claude or other code running as their user.</text><text x="141.159" y="1463.715" fill="#000" font-size="15" textLength="831.101">Workspace and agent-home volumes survive replacement; Terraform blocks their deletion until explicitly allowed.</text><text x="141.159" y="1481.381" fill="#000" font-size="15" textLength="772.434">Host mounts do not prevent execution. Writable sharing allows changes to host scripts and configuration.</text><text x="141.159" y="1499.047" fill="#000" font-size="15" textLength="588.633">Host-state import remains future work. File retention is not a resume guarantee.</text></g></g></svg>