l="none" id="Codex-to-Socket"/><polygon points="206.23,544.573,206.359,534.725,204.259,539.978,199.007,537.878,206.23,544.573" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="210" y="513.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Claude to Socket--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk16" data-source-line="72" data-link-type="dependency"><path d="M395.5,469.493 C377.99,491.683 359.838,514.709 339.238,540.809" style="stroke:#181818;stroke-width:1;" fill="none" id="Claude-to-Socket"/><polygon points="336.14,544.733,344.856,540.147,339.238,540.809,338.576,535.191,336.14,544.733" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="388.1" y="513.502" fill="#000" font-size="16" textLength="120.359">Broker protocol</text></g><!--link Socket to Project--><!--link Project to AgentHome--><!--link Dashboard to Broker--><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" id="lnk19" data-source-line="76" data-link-type="dependency"><path d="M824.92,469.493 C833.89,507.213 844.982,553.829 853.952,591.519" style="stroke:#181818;stroke-width:1;" fill="none" id="Dashboard-to-Broker"/><polygon points="855.11,596.383,856.918,586.702,853.952,591.519,849.135,588.554,855.11,596.383" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="849.38" y="513.502" fill="#000" font-size="16" textLength="240.039">Queries via the same local UDS</text></g><!--link Socket to Broker--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" id="lnk21" data-source-line="77" data-link-type="dependency"><path d="M433.64,647.333 C526.27,647.333 629.15,647.333 717.16,647.333" style="stroke:#181818;stroke-width:1;" fill="none" id="Socket-Broker"/><polygon points="428.64,647.333,437.64,651.333,433.64,647.333,437.64,643.333,428.64,647.333" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="722.16,647.333,713.16,643.333,717.16,647.333,713.16,651.333,722.16,647.333" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="472.451" y="592.802" fill="#000" font-size="16" textLength="206.281">Same shared Incus volume</text><text x="514.833" y="611.646" fill="#000" font-size="16" textLength="121.516">/run/collab-ipc</text><text x="458.81" y="630.49" fill="#000" font-size="16" textLength="233.563">READ-WRITE mount in control</text></g><!--link Broker to DB--><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" id="lnk22" data-source-line="78" data-link-type="dependency"><path d="M867,698.343 C867,745.173 867,809.983 867,858.173" style="stroke:#181818;stroke-width:1;" fill="none" id="Broker-to-DB"/><polygon points="867,863.173,871,854.173,867,858.173,863,854.173,867,863.173" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="878" y="794.112" fill="#000" font-size="16" textLength="94.852">Read / write</text></g><g class="legend" data-source-line="80"><rect x="137.247" y="1282.193" width="857.926" height="185.328" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="163.993" y="1318.695" fill="#000" font-size="15" textLength="99.324" filter="url(#b2mv35l1ho34i0)">Agents in dev</text><text x="268.063" y="1318.695" fill="#000" font-size="15" textLength="14.238">   </text><text x="287.047" y="1318.695" fill="#000" font-size="15" textLength="133" filter="url(#b2mv35l1ho34i1)">Services in control</text><text x="424.794" y="1318.695" fill="#000" font-size="15" textLength="14.238">   </text><text x="443.778" y="1318.695" fill="#000" font-size="15" textLength="173.247" filter="url(#b2mv35l1ho34i2)">One shared Unix socket</text><text x="621.771" y="1318.695" fill="#000" font-size="15" textLength="14.238">   </text><text x="640.755" y="1318.695" fill="#000" font-size="15" textLength="115.825" filter="url(#b2mv35l1ho34i3)">Human controls</text><text x="159.247" y="1336.361" fill="#000" font-size="15" textLength="546.445">Directory: broker:collab-clients, 0750. Socket: broker:collab-clients, 0660.</text><text x="159.247" y="1354.027" fill="#000" font-size="15" textLength="710.757">Map the broker UID and client GID explicitly across Incus containers; mount the directory at boot.</text><text x="159.247" y="1371.693" fill="#000" font-size="15" textLength="642.964">Read-only mount protects the socket path. It does not prevent sending socket requests.</text><text x="159.247" y="1389.359" fill="#000" font-size="15" textLength="743.752">Dev clients share access; this does not isolate Codex from Claude or other code running as their user.</text><text x="159.247" y="1407.025" fill="#000" font-size="15" textLength="744.749">Workspace and agent-home volumes outlive container replacement; removal is explicit, with backups.</text><text x="159.247" y="1424.691" fill="#000" font-size="15" textLength="813.926">Writable host sharing changes host files. UID/GID isolation and noexec cannot prevent later host interpretation.</text><text x="159.247" y="1442.357" fill="#000" font-size="15" textLength="500.83">DRAFT: proposed layout and permissions, not installed provisioning.</text></g></g></svg>